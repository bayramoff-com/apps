<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No Sleep Toggle</title>
  <meta name="description" content="Toggle NoSleep.js on and off with a single tap to stop your screen from going dark during demos or monitoring sessions." />
  <meta name="keywords" content="NoSleep, prevent screen lock, presentation mode, Bayramoff, web utility" />
  <meta name="author" content="Bayramoff" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta property="og:title" content="No Sleep Toggle" />
  <meta property="og:description" content="A sleek toggle that keeps your device awake using NoSleep.js." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bayramoff.com/apps/no-sleep-webpage/" />
  <meta property="og:image" content="https://bayramoff.com/apps/no-sleep-webpage/icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #030712;
      --bg-card: rgba(255, 255, 255, 0.08);
      --fg: #f8fafc;
      --muted: rgba(248, 250, 252, 0.65);
      --accent: #8b5cf6;
      --accent-strong: #c084fc;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
      font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(120% 120% at 75% 20%, #1f2937, var(--bg));
      color: var(--fg);
    }

    main {
      width: min(420px, 100%);
      padding: 2.5rem;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 2rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .status {
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-strong);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .timer {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    button {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.2rem;
      border-radius: 999px;
      transition: transform 200ms ease;
    }

    .toggle:hover {
      transform: translateY(-2px) scale(1.01);
    }

    .toggle svg {
      width: min(100%, 200px);
      height: 80px;
    }

    .toggle svg .track {
      fill: rgba(255, 255, 255, 0.12);
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2;
    }

    .toggle svg .thumb {
      fill: #ffffff;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
      transition: transform 280ms cubic-bezier(.4, 0, .2, 1), fill 200ms ease;
    }

    .toggle svg .glow {
      opacity: 0;
      transition: opacity 250ms ease;
    }

    .toggle[data-state="on"] .thumb {
      fill: url(#thumb-gradient);
      transform: translateX(84px);
    }

    .toggle[data-state="on"] .glow {
      opacity: 0.9;
    }

    .install-button {
      margin-top: 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(34, 197, 94, 0.15);
      color: var(--fg);
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 200ms ease, transform 150ms ease;
      width: 100%;
    }

    .install-button:hover {
      background: rgba(34, 197, 94, 0.25);
      transform: translateY(-1px);
    }

    .install-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      margin-top: 2.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    a {
      color: var(--accent-strong);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 1.5rem;
      }

      main {
        padding: 1.75rem;
      }

      .toggle svg {
        height: 70px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 1rem;
      }

      main {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>No Sleep Mode</h1>
    <p>Keep your display awake while demoing, presenting, or monitoring dashboards. Toggle the switch to enable the
      NoSleep.js library.</p>
    <div class="status" id="status">Status: Off</div>
    <div class="timer" id="timer" aria-live="polite">Running time: 00:00</div>
    <button class="toggle" type="button" aria-pressed="false" id="toggle" aria-label="Enable or disable no sleep mode">
      <svg viewBox="0 0 200 90" role="presentation">
        <defs>
          <linearGradient id="thumb-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22c55e" />
            <stop offset="100%" stop-color="#4ade80" />
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="7" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <rect class="track" x="10" y="15" width="180" height="60" rx="30"></rect>
        <circle class="glow" cx="150" cy="45" r="18" fill="#22c55e" filter="url(#glow)" />
        <circle class="thumb" cx="50" cy="45" r="26"></circle>
      </svg>
    </button> 
    <footer>
      <a href="https://bayramoff.com" target="_blank" rel="noreferrer noopener">Bayramoff</a> | <a href="https://richtr.github.io/NoSleep.js/" target="_blank" rel="noreferrer noopener">NoSleep.js</a> | <a href="#" id="installButton" >Install</a>
    </footer>
  </main>

  <script src="https://richtr.github.io/NoSleep.js/dist/NoSleep.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const toggleButton = document.getElementById('toggle');
    const installButton = document.getElementById('installButton');
    const noSleep = new NoSleep();
    const timerDefaultText = 'Running time: 00:00';
    let isEnabled = false;
    let timerStart = null;
    let timerInterval = null;
    let deferredInstallPrompt = null;

    const formatDuration = (ms) => {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const segment = (value) => String(value).padStart(2, '0');
      if (hours > 0) {
        return `${segment(hours)}:${segment(minutes)}:${segment(seconds)}`;
      }
      return `${segment(minutes)}:${segment(seconds)}`;
    };

    const stopTimer = () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerStart = null;
      timerEl.textContent = timerDefaultText;
    };

    const startTimer = () => {
      timerStart = Date.now();
      if (timerInterval) {
        clearInterval(timerInterval);
      }
      const render = () => {
        const elapsed = Date.now() - timerStart;
        timerEl.textContent = `Running time: ${formatDuration(elapsed)}`;
      };
      render();
      timerInterval = setInterval(render, 1000);
    };

    const updateUI = () => {
      toggleButton.dataset.state = isEnabled ? 'on' : 'off';
      toggleButton.setAttribute('aria-pressed', String(isEnabled));
      statusEl.textContent = `Status: ${isEnabled ? 'On' : 'Off'}`;
    };

    toggleButton.addEventListener('click', async () => {
      try {
        if (!isEnabled) {
          await noSleep.enable();
          isEnabled = true;
          startTimer();
        } else {
          noSleep.disable();
          isEnabled = false;
          stopTimer();
        }
        updateUI();
      } catch (error) {
        console.error('Unable to toggle NoSleep', error);
        isEnabled = false;
        updateUI();
        stopTimer();
        statusEl.textContent = 'Interaction required to toggle.';
      }
    });

    updateUI();
    stopTimer();

    const hideInstallButton = () => {
      if (installButton) {
        installButton.hidden = true;
        installButton.disabled = false;
      }
    };

    if (window.matchMedia('(display-mode: standalone)').matches) {
      hideInstallButton();
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (installButton) {
        installButton.hidden = false;
      }
    });

    if (installButton) {
      installButton.addEventListener('click', async () => {
        if (!deferredInstallPrompt) {
          return;
        }
        installButton.disabled = true;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        hideInstallButton();
      });
    }

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      hideInstallButton();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.error('SW registration failed', error);
        });
      });
    }
  </script>
</body>

</html>
